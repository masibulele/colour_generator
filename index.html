<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <title>Colour generator</title>
</head>
<body>
    <div class="container">
        <h1 class="title">Colour Palette Generator</h1>
        <div class="btn-container">
            <button class="generate-btn">
                <i class="fa-solid fa-arrows-rotate"></i>
                Generate Palette

            </button>
        </div>
        <div class="colour-container">
            <div class="colour-box-container">
                <div class="colour-box" id="box-1">

                </div>
                <div class="colour-title-container">
                    <h6 class="colour-title">
                        #c7522a
                         <button class="copy-btn">
                            <i class="fa-solid fa-copy"></i>
                        </button>
                    </h6>
                </div>
            </div>
            <div class="colour-box-container">
                <div class="colour-box" id="box-2">

                </div>
                <div class="colour-title-container">
                    <h6 class="colour-title">
                        #008585
                         <button class="copy-btn">
                            <i class="fa-solid fa-copy"></i>
                        </button>
                    </h6>
                </div>
            </div>
            <div class="colour-box-container">
                <div class="colour-box" id="box-3">

                </div>
                <div class="colour-title-container">
                    <h6 class="colour-title">
                        #74a892
                         <button class="copy-btn">
                            <i class="fa-solid fa-copy"></i>
                        </button>
                    </h6>
                </div>
            </div>
            <div class="colour-box-container">
                <div class="colour-box" id="box-4">

                </div>
                <div class="colour-title-container">
                    <h6 class="colour-title">
                        #fbf2c4
                         <button class="copy-btn">
                            <i class="fa-solid fa-copy"></i>
                        </button>
                        
                    </h6>
                </div>
            </div>
            <div class="colour-box-container">
                <div class="colour-box" id="box-5">

                </div>
                <div class="colour-title-container">
                    <h6 class="colour-title">
                        #e5c185
                        <button class="copy-btn">
                            <i class="fa-solid fa-copy"></i>
                        </button>
                        
                    </h6>
                </div>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
